
name: Terraform CI/CD

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      action:
        description: "Select Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform CI/CD
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-2
      TF_IN_AUTOMATION: true

    steps:
      # Get Terraform code from GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Initialize Terraform
      - name: Terraform Init
        run: terraform init -input=false

      # Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # Generate execution plan
      - name: Terraform Plan
        if: github.event_name == 'pull_request' || github.event_name == 'push' || inputs.action == 'plan'
        run: terraform plan -input=false

      # Deploy AWS infrastructure
      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve

      # Destroy AWS infrastructure
      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve
