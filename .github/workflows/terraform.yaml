
name: Terraform Destroy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        run: terraform version

      - name: Terraform Initialize
        run: terraform init -input=false

      - name: Select Terraform Workspace
        run: |
          terraform workspace list
          terraform workspace select default

      - name: Verify Terraform State
        run: |
          echo "Current workspace:"
          terraform workspace show

          echo "Resources tracked in state:"
          terraform state list

      - name: Generate Destroy Plan
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Execute Terraform Destroy
        run: terraform apply -input=false -auto-approve destroy.tfplan

      - name: Verify Destruction
        run: |
          echo "Remaining Terraform resources:"
          terraform state list || true

          echo "Destroy pipeline completed."
